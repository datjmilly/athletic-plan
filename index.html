<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Athletic Plan"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Athletic Plan</title><style>:root{--p:#0f1b2d;--p2:#132239;--l:#20324d;--t:#f4f7fb;--m:#9fb0c7;--a:#77e0b5;--a2:#8fb7ff;--w:#ffcf70}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#07101c,#0a1423);color:var(--t);min-height:100vh}.s{max-width:1100px;margin:auto;padding:22px 14px 50px}.ey{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--a);font-weight:800}h1{font-size:42px;margin:7px 0 8px;letter-spacing:-.04em}.sub{color:var(--m);line-height:1.45;max-width:720px}.weeks{display:flex;gap:7px;overflow:auto;margin:22px 0 10px}.wb,.day,.btn{border:1px solid var(--l);background:var(--p);color:var(--m);border-radius:12px;padding:10px 12px;font-weight:800}.wb.on{background:var(--t);color:#08111f}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:14px}.day{text-align:left;min-height:78px;color:var(--t)}.day.on{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a)}.dt{font-size:11px;color:var(--m);margin-top:5px}.hero,.card{background:var(--p);border:1px solid var(--l);border-radius:18px}.hero{padding:20px;margin-bottom:12px;background:linear-gradient(135deg,var(--p2),var(--p))}.hero h2{font-size:30px;margin:5px 0 8px}.goal{color:#c8d7e8;line-height:1.45}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.badge{background:#0a1627;border:1px solid #25405e;padding:6px 9px;border-radius:999px;font-size:12px}.complete{display:inline-flex;gap:7px;align-items:center;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:16px}.wide{grid-column:1/-1}.card h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--a2);margin:0 0 10px}.list{display:flex;flex-direction:column;gap:8px}.ex{display:grid;grid-template-columns:1.35fr .7fr 1.35fr;gap:10px;background:#0a1627;border:1px solid #203854;border-radius:12px;padding:11px}.name{font-weight:800}.dose{font-size:12px;color:var(--a);font-weight:800}.tip{font-size:12px;color:#b9c8da;line-height:1.4}.tip b{color:var(--w)}.note{color:#d9e4f1;line-height:1.55}.footer{display:flex;justify-content:space-between;gap:8px;margin-top:14px;color:var(--m);font-size:12px}@media(max-width:800px){.days{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:560px){h1{font-size:36px}.days{grid-template-columns:repeat(2,1fr)}.ex{grid-template-columns:1fr;gap:5px}.dose{background:#10263a;padding:5px 7px;border-radius:8px;width:max-content}.s{padding:18px 11px 42px}}</style></head><body><main class="s"><div class="ey">8-week lower-body capacity plan</div><h1>Athletic Plan</h1><div class="sub">Your complete plan is built into the app. No Excel upload is required. Tap a week and day to see the session.</div><div id="weeks" class="weeks"></div><div id="days" class="days"></div><section class="hero"><div class="ey" id="label"></div><h2 id="title"></h2><div class="goal" id="goal"></div><div class="badges"><span class="badge" id="time"></span><span class="badge" id="rpe"></span></div><label class="complete"><input id="done" type="checkbox"> Completed</label></section><div id="cards" class="grid"></div><div class="footer"><span>Plan embedded · works offline after first load</span><button id="reset" class="btn">Reset completion</button></div></main><script>const D=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],PD={Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'},P='ap_progress_v4',Q='ap_pref_v4';const mileage=[2.5,3.5,4.5,5.5,7,8.5,10,12],mon=[1,1,1.25,1.5,2,2.5,3,3.5],fri=[0,1,1.25,1.5,2,2.5,3,3.5],sun=[1.5,1.5,2,2.5,3,3.5,4,5];const common={morning:'toe yoga 1×8 each pattern; knee-to-wall ankle rock 1×10/side; seated tibial IR/ER 1×8/side; 90/90 hip switches 1×8/side; half-kneeling hip-flexor reach 1×5 breaths/side',recoveryMorning:'ankle CAR 1×5 each way/side; knee-to-wall 1×8/side; calf stretch 45s/side; soleus stretch 45s/side; 90/90 breathing 5 breaths/side; adductor rock-back 1×8/side; easy nasal breathing 2 min',strengthWarm:'brisk walk/bike 2 min; knee-to-wall 8/side; tib raise 15; calf raise 10; squat-to-stand 6; glute bridge 10; lateral band walk 8/side; 2 ramp-up sets of first lift',athWarm:'jog/skip 2 min; ankle rock 8/side; calf raise 10; tib raise 15; snap-down 2×3; A-march/A-skip 2×15 m; lateral shuffle 2×10 m; 2 progressive pogo/build-up sets',runWarm:'brisk walk 3 min; toe walk 15 m; heel walk 15 m; ankle rock 8/side; marching A-drill 2×15 m; 2×20s very easy jog',cool:'walk 2–3 min; calf stretch 30s/side; soleus stretch 30s/side; hip-flexor 30s/side; 5 slow breaths',night:'calf stretch 2×30s/side; soleus stretch 2×30s/side; half-kneeling hip-flexor 45s/side; 90/90 hold 45s/side; adductor rock-back 6/side; 2 min slow nasal breathing',recoveryNight:'legs-up-wall or supine breathing 3 min; ankle CAR 1×5 each way/side; 90/90 switches 1×6/side; hamstring stretch 45s/side; quad/hip-flexor 45s/side; gentle foot roll 60s/side optional'};const A=['Goblet squat to box 3×8 @RPE6, 2–3s down; step-down 3×6/side, 3s down; standing calf raise 3×10; soleus raise 3×12; tibialis raise 3×15; dead bug 3×6/side','Goblet squat to box/free 3×9 @RPE6; step-down 3×7/side; calf raise 3×12; soleus raise 3×14; tibialis 3×18; dead bug 3×7/side','Goblet squat 4×8 @RPE6–7; step-down 3×8/side; calf raise 4×10; soleus raise 4×12; tibialis 3×20; dead bug 3×8/side','Goblet squat 4×8 @RPE7; loaded step-down 3×8/side; calf raise 4×10; soleus 4×12; tibialis 3×20; Pallof press 3×10/side','Goblet/front-loaded squat 4×7 @RPE7; step-down 3×8/side; single-leg calf raise 4×8/side; soleus 4×10; tibialis 3×20; Pallof 3×10/side','Goblet squat 4×6 @RPE7–8, 2s bottom pause; loaded step-down 3×8/side; single-leg calf raise 4×8/side; soleus 4×10; tibialis 3×20; Pallof 3×10/side','Double-KB/front-loaded squat or heavy goblet 4×5–6 @RPE7–8; step-down 3×6/side; single-leg calf raise 4×10/side; soleus 4×10; tibialis 3×20; dead bug 3×8/side','Consolidate: goblet/front-loaded squat 3×6 @RPE6–7; step-down 2×6/side; single-leg calf raise 3×8/side; soleus 3×10; tibialis 2×15; dead bug 2×6/side; 10 pristine bodyweight squats'];const B=['Split squat 3×6/side, 3s eccentric @RPE6; DB/Rucksack RDL 3×8; hamstring bridge 3×10; side plank 2×20s/side','Split squat 3×7/side @RPE6; RDL 3×9; hamstring slider curl 2×6; side plank 2×25s/side','Split squat 3×8/side @RPE6–7; RDL 4×8; slider curl 3×6; side plank 3×25s/side','Loaded split squat 4×6/side @RPE7; RDL 4×8; slider curl 3×8; side plank 3×30s/side','Rear-foot-elevated split squat 3×7/side @RPE7; single-leg RDL 3×8/side; slider curl 3×8; side plank 3×30s/side','Rear-foot-elevated split squat 4×6/side @RPE7; single-leg RDL 3×8/side; hamstring slider 3×10; side plank 3×30s/side','RFESS 4×6/side @RPE7–8; single-leg RDL 3×8/side; Nordic eccentric 2×4; side plank 3×30s/side','Consolidate: split squat 3×6/side @RPE6–7; single-leg RDL 2×8/side; slider curl 2×8; side plank 2×25s/side'];const C=['Step-up 3×8/side @RPE6; lateral lunge 2×6/side; hip thrust 3×10; shallow reverse Nordic 2×6; suitcase carry 3×20 m/side','Step-up 3×9/side; lateral lunge 3×6/side; hip thrust 3×12; reverse Nordic 2×7; suitcase carry 3×25 m/side','Loaded step-up 3×8/side @RPE6–7; lateral lunge 3×7/side; hip thrust 4×10; reverse Nordic 3×6; suitcase carry 3×25 m/side','Loaded step-up 3×8/side @RPE7; lateral lunge 3×8/side; hip thrust 4×10; reverse Nordic 3×7; suitcase carry 3×30 m/side','Step-up with 2s controlled lowering 3×6/side @RPE7; lateral lunge 3×8/side; hip thrust 4×8; reverse Nordic 3×8; suitcase carry 3×30 m/side','Heavy step-up 3×6/side @RPE7; lateral lunge 3×8/side; hip thrust 4×8; reverse Nordic 3×8; carry 3×30 m/side','Heavy step-up 3×6/side @RPE7–8; lateral lunge 3×6/side; hip thrust 3×8; reverse Nordic 2×6; carry 3×30 m/side','Consolidate: step-up 2×6/side @RPE6; lateral lunge 2×6/side; hip thrust 3×8; reverse Nordic 2×6; carry 2×25 m/side'];const ply=['Snap-down 3×3; low pogo 3×10; squat jump-to-stick 2×3 @60%','Snap-down 3×4; pogo 3×15; forward hop-to-stick 2×4/side @60–65%','Pogo 4×15; lateral line hop 2×10/side; broad jump-to-stick 3×3 @65–70%; 4×10 m build-up + controlled stop','Pogo 3×20; lateral hop-to-stick 3×4/side; broad jump 3×3 @70%; decel 4×10 m','Pogo 3×20; single-leg hop-to-stick 2×4/side; lateral bound-to-stick 3×4/side; decel 4×10 m @70–75%','Pogo 3×20; CMJ 3×3 @80%; lateral bounds 3×5/side; decel 4×10 m @75–80%; 3×15 m relaxed sprint @80–85%','Pogo 2×20; CMJ 3×3 @85%; lateral bound-to-stick 3×4/side; decel 4×10 m @80%; 3×15 m relaxed sprint @85–90%','Volume down ~40%: pogo 2×20; CMJ 3×3 @80–85%; lateral bound-to-stick 2×4/side; 3×10 m decel @80%; 3×15 m relaxed sprint @85–90% only if symptom-free'];function row(week,day){let i=week-1,recovery='Recovery only: easy walk 15–25 min OR bike/elliptical 20–30 min @RPE2; no lower-body strength.',base={week,day};if(day==='Mon')return{...base,type:'Strength A + short run',morning:common.morning,warm:common.strengthWarm,strength:A[i],iso:i===2?'Overcoming squat pull 3×5s @85–90% if setup is secure; calf top hold 2×25s':i===7?'Calf top hold 2×20s/side @RPE5':'Calf/split-squat hold 2–3×20–30s/side @RPE5–7',ath:i===0?'None; learn strength positions first.':i===7?'Pogo 2×15 only, crisp and easy':'Snap-down/pogo primer 2×3–20 contacts, crisp only',run:`${mon[i]} mi easy, flat if possible; RPE2–3/10, full-sentence conversational pace.${i>=5?' Include 4×15–20s relaxed strides after easy running.':''}`,cool:common.cool,night:common.night,total:'80–105 min total',rpe:'RPE6–7 overall',goal:'Squat pattern + ankle/calf strength + aerobic exposure',prog:`Week ${week} running target: ${mileage[i]} mi. Add load only with ≥2 clean reps in reserve and no next-day flare.`,mod:'Heavy legs/poor sleep: remove plyo primer, reduce calf/soleus volume, and cut run 30–50% or omit.'};if(day==='Tue')return{...base,type:'Recovery / mobility',morning:common.recoveryMorning,warm:'5 min easy walk + relaxed nasal breathing',strength:recovery,iso:i<6?'Optional horse stance + calf mid-range holds 2×30–45s':'Optional horse stance 2×30–45s only',ath:'None',run:'No run',cool:'Normal walking only; keep low-load',night:common.recoveryNight,total:'20–30 min total',rpe:'RPE1–2',goal:'Restore motion; low-intensity tissue capacity',prog:'Do not add extra impact on a recovery day; adaptation is the goal.',mod:'If genuinely tired, do only 10–20 min walk + breathing.'};if(day==='Wed')return{...base,type:'Strength B + plyometric/COD',morning:'knee-to-wall 1×10/side; 90/90 switches 2×6/side; adductor rock-back 1×8/side; squat-to-stand 1×6; deep-squat pry 2×20s; hip-flexor reach 30s/side',warm:common.athWarm,strength:B[i],iso:i===7?'Spanish squat 2×30s; Copenhagen 2×20s/side':`Spanish squat ${i<2?'3':'4'}×${30+Math.min(i,3)*5}s; Copenhagen 2–3×20–30s/side`,ath:ply[i],run:'No run',cool:'walk 3 min; adductor rock-back 6/side; 90/90 hold 30s/side; 5 slow breaths',night:common.night,total:'65–90 min total',rpe:i===7?'RPE6–7; athletic work crisp, low volume':'Strength RPE6–7; plyo quality first',goal:'Unilateral/posterior strength + tendon/landing/COD',prog:i===7?'Consolidate/readiness week: reduced contacts, no max testing.':'Quality before height/distance; every landing quiet, balanced, and repeatable.',mod:'Sharp/localized tendon-joint pain, limp, or worsening pain: stop plyo/COD and use pain-free strength at 50–70% volume or bike.'};if(day==='Thu')return{...base,type:'Recovery / low-load aerobic optional',morning:common.recoveryMorning,warm:'5 min easy walk + relaxed breathing',strength:recovery,iso:'None',ath:'None',run:'No run',cool:'Normal walking only; keep recovery day low-load',night:common.recoveryNight,total:'20–30 min total',rpe:'RPE1–2',goal:'Absorb training; maintain circulation without impact',prog:'Do not add extra impact on a recovery day.',mod:'If soreness is >2/10 or persistent, choose full rest except gentle mobility.'};if(day==='Fri')return{...base,type:'Strength C + easy run',morning:'short-foot 2×20s/side; toe yoga 1×8; knee-to-wall 2×8/side; bent-knee ankle rock 1×10/side; controlled calf raise 1×10; assisted hip airplane 1×5/side',warm:common.strengthWarm,strength:C[i],iso:`Soleus mid-range hold 3×${30+Math.min(i,3)*5}s/side`,ath:'None',run:fri[i]?`${fri[i]} mi easy, flat if possible; RPE2–3/10, full-sentence pace.`:'No run',cool:common.cool,night:common.night,total:'60–100 min total',rpe:'Strength RPE6–7; run RPE2–3',goal:'Hip/frontal-plane strength + soleus endurance + easy aerobic',prog:'If strength makes the run mechanically sloppy, split sessions by ≥4 h or cut the run 25–50%.',mod:'If pickup sport is planned within 24 h, skip the run and cut strength 1 set/exercise.'};if(day==='Sat')return{...base,type:'Recovery / readiness',morning:common.recoveryMorning,warm:'5 min easy walk + relaxed breathing',strength:'Recovery/readiness only: 15–20 min easy walk; no strength.',iso:'None',ath:'None',run:'No run',cool:'Normal walking only; keep low-load',night:common.recoveryNight,total:'20–30 min total',rpe:'RPE1–2',goal:'Freshen legs for long run; monitor symptoms',prog:'Do not add extra impact on a recovery day.',mod:'Pickup sport today replaces next planned plyo/COD session; if hard/long, reduce Sunday run 25–50%.'};return{...base,type:'Long easy run',morning:common.morning,warm:common.runWarm,strength:'No strength; running is the main session.',iso:'None',ath:'None',run:`${sun[i]} mi easy, flat if possible; RPE2–3/10, full-sentence conversational pace. Finish feeling you could continue 10–15 min; no fast finish.`,cool:'walk 5 min; calf 30s/side; soleus 30s/side; hip-flexor 30s/side; hydrate/eat normally',night:'easy walk 2 min; calf 45s/side; soleus 45s/side; hip-flexor 45s/side; adductor 45s/side; 90/90 45s/side; 2–3 min slow breathing',total:'45–85 min total',rpe:'Run RPE2–3; no grinding',goal:'Aerobic base + repeated-impact tolerance at low intensity',prog:'Complete full distance only if morning soreness is ≤2/10 and gait/first 5 min feel normal.',mod:'If calves/shins/Achilles/knees are more sore than usual, replace with 30–45 min easy bike/elliptical; do not make up miles later.'}}const rows=[];for(let w=1;w<=8;w++)for(const d of D)rows.push(row(w,d));let q=JSON.parse(localStorage.getItem(Q)||'{}'),w=q.w||1,d=q.d||'Mon';const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pr=()=>JSON.parse(localStorage.getItem(P)||'{}'),save=()=>localStorage.setItem(Q,JSON.stringify({w,d}));function wr(){return rows.filter(r=>r.week===w)}function cur(){return rows.find(r=>r.week===w&&r.day===d)}const tips={squat:'Brace first, keep a tripod foot, and track knees over toes.','split squat':'Stay balanced over the whole front foot and control the lowering.',rdl:'Hinge from the hips with a neutral spine and stop at strong hamstring tension.',calf:'Keep pressure through the big toe and use smooth, controlled reps.',soleus:'Keep the heel controlled and load through the forefoot without collapsing the arch.',tib:'Keep heels planted and pull the toes up under control.',pogo:'Stay springy with short ground contact and quiet landings.',jump:'Prioritize a crisp takeoff and soft, balanced landing.',run:'Stay relaxed and avoid overstriding.',ankle:'Move through comfortable range without forcing.',default:'Use controlled reps and stable joint positions; stop if technique or comfort worsens.'};function tip(n,s){let z=(n+' '+s).toLowerCase();for(let k in tips)if(k!=='default'&&z.includes(k))return tips[k];if(/mobility|cool|night/.test(s.toLowerCase()))return'Use gentle range and slow breathing; do not force painful positions.';return tips.default}function parts(t){if(!t||/^(none|no run)/i.test(t))return[];return t.split(';').map(x=>x.trim()).filter(Boolean)}function parse(x,s){let m=x.match(/^(.*?)(\d+\s*[×x]\s*[^,;]+|\d+(?:–|-)?\d*\s*(?:s|sec|min|mi|m|reps?).*)$/i);return{name:(m?m[1]:x).trim(),dose:m?m[2].trim():'As written',tip:tip(m?m[1]:x,s)}}function card(t,v,wide=''){let a=parts(v).map(x=>parse(x,t));return`<article class="card ${wide}"><h3>${t}</h3>${a.length?`<div class="list">${a.map(x=>`<div class="ex"><div class="name">${esc(x.name)}</div><div class="dose">${esc(x.dose)}</div><div class="tip"><b>Focus:</b> ${esc(x.tip)}</div></div>`).join('')}</div>`:`<div class="note">${esc(v||'None planned')}</div>`}</article>`}function render(){let p=pr();$('#weeks').innerHTML=[1,2,3,4,5,6,7,8].map(x=>`<button class="wb ${x===w?'on':''}" data-w="${x}">Week ${x}</button>`).join('');document.querySelectorAll('.wb').forEach(b=>b.onclick=()=>{w=+b.dataset.w;save();render()});$('#days').innerHTML=wr().map(r=>`<button class="day ${r.day===d?'on':''}" data-d="${r.day}"><b>${PD[r.day]}${p[w+'-'+r.day]?' ✓':''}</b><div class="dt">${esc(r.type)}</div></button>`).join('');document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{d=b.dataset.d;save();render()});let r=cur(),k=w+'-'+d;$('#label').textContent=`Week ${w} · ${PD[d]}`;$('#title').textContent=r.type;$('#goal').textContent=r.goal;$('#time').textContent=r.total;$('#rpe').textContent=r.rpe;$('#done').checked=!!p[k];$('#done').onchange=e=>{p[k]=e.target.checked;localStorage.setItem(P,JSON.stringify(p));render()};$('#cards').innerHTML=[['Morning mobility',r.morning],['Warm-up',r.warm],['Main strength',r.strength,'wide'],['Isometrics',r.iso],['Athletic / plyometric work',r.ath],['Running',r.run,'wide'],['Cool-down',r.cool],['Night mobility',r.night]].map(x=>card(...x)).join('')+card('Progression note',r.prog,'wide')+card('Modification / recovery option',r.mod,'wide')}$('#reset').onclick=()=>{if(confirm('Reset all completed days?')){localStorage.removeItem(P);render()}};render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
